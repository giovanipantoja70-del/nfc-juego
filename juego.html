<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Jump Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#1a1a2e;color:#fff;overflow:hidden;touch-action:manipulation}
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px;position:relative;z-index:10;background:#1a1a2e;overflow-y:auto}
#menu h1{font-size:2.15em;margin-bottom:6px;color:#e94560}
#menu p.sub{font-size:0.95em;margin-bottom:18px;color:#aaa}
#menu input{width:80%;max-width:280px;padding:13px 18px;font-size:1.08em;border:2px solid #e94560;border-radius:12px;background:transparent;color:#fff;outline:none;text-align:center;margin-bottom:16px}
button{padding:13px 46px;font-size:1.15em;border:none;border-radius:12px;background:#e94560;color:#fff;cursor:pointer;font-weight:bold}
button:active{transform:scale(0.97)}
#gameCanvas{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:1.05em;font-weight:bold;color:#fff;z-index:5;text-shadow:0 2px 4px rgba(0,0,0,.7);display:none;gap:10px}
#hud span{margin:0 6px}
#gameOver{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;background:rgba(0,0,0,.84);position:fixed;top:0;left:0;width:100vw;z-index:20;padding:20px;overflow-y:auto}
#gameOver h1{font-size:1.9em;color:#e94560;margin-bottom:8px}
#gameOver .score{font-size:1.7em;color:#ffd700;font-weight:bold;margin-bottom:12px}
#instructions{font-size:.82em;color:#888;margin-top:10px}
.ranking{width:100%;max-width:320px;margin:14px 0;background:rgba(255,255,255,.06);border:1px solid rgba(233,69,96,.3);border-radius:12px;padding:12px}
.ranking h3{font-size:.95em;color:#e94560;margin-bottom:8px;text-align:center}
.ranking ol{list-style:none;padding:0}
.ranking li{display:flex;justify-content:space-between;padding:6px 8px;border-radius:8px;font-size:.9em}
.ranking li.me{background:rgba(233,69,96,.18);font-weight:bold}
.ranking li:nth-child(1){color:#ffd700}
.ranking li:nth-child(2){color:#c0c0c0}
.ranking li:nth-child(3){color:#cd7f32}
.small{font-size:.78em;color:#777;margin-top:6px}
</style>
</head>
<body>
<div id="menu">
  <h1>🏃 Salta Obstaculos</h1>
  <p class="sub">¡Doble salto activado! Toca 2 veces en el aire</p>
  <input type="text" id="nameInput" placeholder="Tu nombre" maxlength="15" autocomplete="off">
  <button id="playBtn">¡Jugar!</button>
  <div id="instructions">Toca la pantalla o espacio para saltar (2 saltos)</div>
  <div class="ranking" id="menuRanking"></div>
  <div class="small">Sonido al saltar 🔊 • Ranking guardado en este celular</div>
</div>
<canvas id="gameCanvas"></canvas>
<div id="hud"></div>
<div id="gameOver">
  <h1>Game Over!</h1>
  <p>Jugador: <span id="goName"></span></p>
  <p class="score" id="goScore"></p>
  <div class="ranking" id="goRanking"></div>
  <button id="restartBtn">Jugar de nuevo</button>
  <button id="menuBtn" style="margin-top:10px;background:transparent;border:2px solid #e94560">Menu</button>
</div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const menu=document.getElementById('menu');
const hud=document.getElementById('hud');
const gameOverScreen=document.getElementById('gameOver');
const goName=document.getElementById('goName');
const goScore=document.getElementById('goScore');
const nameInput=document.getElementById('nameInput');
const playBtn=document.getElementById('playBtn');
const restartBtn=document.getElementById('restartBtn');
const menuBtn=document.getElementById('menuBtn');
const menuRanking=document.getElementById('menuRanking');
const goRanking=document.getElementById('goRanking');
let W,H,player,obstacles=[],score=0,gameRunning=false,animId,speed=5,obstaclesPassed=0;
const GRAVITY=0.68,JUMP_FORCE=-12.5,DOUBLE_JUMP_FORCE=-11,GROUND_RATIO=0.15,MAX_JUMPS=2;

// --- Sonido ---
let audioCtx;
function getAudio(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx;}
function playJumpSound(doubleB=false){
  try{
    const ac=getAudio();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.frequency.value= doubleB ? 520 : 380;
    o.connect(g); g.connect(ac.destination);
    g.gain.value=0.18;
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.22);
    o.frequency.exponentialRampToValueAtTime(doubleB? 880: 620, ac.currentTime+0.12);
    o.stop(ac.currentTime+0.23);
  }catch(e){}
}
function playHitSound(){
  try{
    const ac=getAudio();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='square'; o.frequency.value=180;
    o.connect(g); g.connect(ac.destination);
    g.gain.value=0.2; o.start();
    o.frequency.linearRampToValueAtTime(70, ac.currentTime+0.25);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.3);
    o.stop(ac.currentTime+0.32);
  }catch(e){}
}

// --- Ranking localStorage ---
const STORE_KEY='nfc_juego_ranking_v2';
function loadRanking(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch{return []}}
function saveScore(name, sc){
  const list=loadRanking();
  list.push({name:name, score:Math.floor(sc), date:Date.now()});
  // mantener solo el mejor por nombre
  const map=new Map();
  for(const e of list){
    const cur=map.get(e.name);
    if(!cur || e.score>cur.score) map.set(e.name,e);
  }
  const best=[...map.values()].sort((a,b)=>b.score-a.score).slice(0,10);
  localStorage.setItem(STORE_KEY, JSON.stringify(best));
  return best;
}
function renderRanking(container, highlightName){
  const list=loadRanking();
  if(list.length===0){container.innerHTML='<h3>🏆 Ranking</h3><p style="color:#777;font-size:.85em">Aun sin partidas</p>'; return;}
  let html='<h3>🏆 Top 10</h3><ol>';
  list.forEach((e,i)=>{
    const cls=e.name===highlightName?' class="me"':'';
    html+=`<li${cls}><span>${i+1}. ${e.name}</span><span>${e.score}m</span></li>`;
  });
  html+='</ol>';
  container.innerHTML=html;
}

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);
renderRanking(menuRanking);

function initGame(playerName){
  resize();
  player={x:W*0.15,y:H*(1-GROUND_RATIO)-45,w:35,h:45,vy:0,grounded:true,jumps:0,name:playerName};
  obstacles=[];score=0;speed=5;obstaclesPassed=0;
  gameOverScreen.style.display='none';
  menu.style.display='none';
  canvas.style.display='block';
  hud.style.display='block';
  hud.textContent=player.name+' - 0m';
  getAudio(); // desbloquear audio en gesto de usuario
  drawBg();drawPlayer();
}
function drawBg(){
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1a1a2e');grad.addColorStop(1,'#16213e');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  const groundY=H*(1-GROUND_RATIO);
  ctx.fillStyle='#0f3460';ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='#e94560';ctx.fillRect(0,groundY,W,4);
  ctx.fillStyle='#1f2d45';ctx.beginPath();ctx.moveTo(0,groundY);
  for(let i=0;i<=W;i+=40){ctx.lineTo(i,groundY-30-Math.sin(i*0.01)*25-Math.sin(i*0.025)*15)}
  ctx.lineTo(W,groundY);ctx.fill();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function drawPlayer(){
  ctx.fillStyle='#e94560';roundRect(player.x,player.y,player.w,player.h,8);ctx.fill();
  // indicar doble salto disponible con puntito
  if(player.jumps===1){ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(player.x+player.w/2,player.y-8,4,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x+player.w*0.62,player.y+13,6,0,Math.PI*2);ctx.arc(player.x+player.w*0.85,player.y+13,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(player.x+player.w*0.64,player.y+13,2.5,0,Math.PI*2);ctx.arc(player.x+player.w*0.87,player.y+13,2.5,0,Math.PI*2);ctx.fill();
}
function drawObstacles(){
  obstacles.forEach(o=>{
    if(o.type==='spike'){ctx.fillStyle='#ffd700';ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill()}
    else{ctx.fillStyle='#0f3460';ctx.strokeStyle='#e94560';ctx.lineWidth=3;roundRect(o.x,o.y,o.w,o.h,6);ctx.fill();ctx.stroke();ctx.fillStyle='#e94560';ctx.beginPath();ctx.arc(o.x+o.w*0.32,o.y+o.h*0.32,4,0,Math.PI*2);ctx.arc(o.x+o.w*0.68,o.y+o.h*0.32,4,0,Math.PI*2);ctx.fill()}
  });
}
function update(){
  if(!gameRunning) return;
  speed=5+obstaclesPassed*0.26;
  score+=speed*0.16;
  hud.textContent=player.name+' - '+Math.floor(score)+'m';
  if(!player.grounded){player.vy+=GRAVITY;player.y+=player.vy;const gy=H*(1-GROUND_RATIO)-player.h;if(player.y>=gy){player.y=gy;player.vy=0;player.grounded=true;player.jumps=0;}}
  if(Math.random()<0.017){const type=Math.random()<0.4?'spike':'box';const groundY=H*(1-GROUND_RATIO);const w=26+Math.random()*14;const h=type==='spike'?38:28+Math.random()*22;obstacles.push({x:W+10,y:groundY-h,w:w,h:h,type:type,passed:false});if(type==='box') obstaclesPassed++}
  obstacles.forEach(o=>{o.x-=speed;if(!o.passed&&o.x+o.w<player.x){o.passed=true;if(o.type==='box') score+=5}});
  obstacles=obstacles.filter(o=>o.x+o.w>-40);
  const pr=5;
  for(const o of obstacles){if(player.x+player.w-pr>o.x&&player.x+pr<o.x+o.w&&player.y+player.h-pr>o.y&&player.y+pr<o.y+o.h){gameRunning=false;cancelAnimationFrame(animId);playHitSound();const best=saveScore(player.name, score);goName.textContent=player.name;goScore.textContent=Math.floor(score)+'m';renderRanking(goRanking, player.name);renderRanking(menuRanking, player.name);gameOverScreen.style.display='flex';return}}
  drawBg();drawObstacles();drawPlayer();
}
function jump(){
  if(!gameRunning||!player) return;
  if(player.jumps>=MAX_JUMPS) return;
  const isDouble = player.jumps===1;
  player.vy = isDouble ? DOUBLE_JUMP_FORCE : JUMP_FORCE;
  player.grounded=false;
  player.jumps++;
  playJumpSound(isDouble);
}
function startLoop(){function loop(){update();if(gameRunning) animId=requestAnimationFrame(loop)} loop()}
function showMenu(){
  gameRunning=false;cancelAnimationFrame(animId);
  gameOverScreen.style.display='none';
  canvas.style.display='none';
  hud.style.display='none';
  menu.style.display='flex';
  renderRanking(menuRanking, nameInput.value.trim()||null);
}
playBtn.addEventListener('click',()=>{const n=nameInput.value.trim()||'Jugador';initGame(n);gameRunning=true;startLoop()});
restartBtn.addEventListener('click',()=>{const n=goName.textContent||'Jugador';initGame(n);gameRunning=true;startLoop()});
menuBtn.addEventListener('click', showMenu);
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&gameRunning){e.preventDefault();jump()}});
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});
document.addEventListener('touchstart',e=>{if(gameRunning&&canvas.style.display==='block'&&e.target!==restartBtn&&e.target!==menuBtn) { if(e.target===playBtn) return; jump(); }},{passive:false});
canvas.addEventListener('mousedown',()=>{if(gameRunning) jump()});
</script>
</body>
</html>
