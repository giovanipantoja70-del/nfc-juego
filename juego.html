<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TSUNAMI Z</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f0f0f;color:#fff;overflow:hidden;touch-action:manipulation}
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px;background:linear-gradient(180deg,#0a1a0a,#0f4a1f);overflow-y:auto}
#menu h1{font-size:2.7em;letter-spacing:3px;color:#39ff14;text-shadow:0 0 14px rgba(57,255,20,.7);margin-bottom:6px}
#menu p.sub{color:#b0ff9a;margin-bottom:18px;font-size:.95em}
#menu input{width:80%;max-width:280px;padding:13px 18px;font-size:1.05em;border:2px solid #39ff14;border-radius:12px;background:rgba(0,0,0,.35);color:#fff;outline:none;text-align:center;margin-bottom:14px}
button{padding:13px 42px;font-size:1.08em;border:none;border-radius:12px;background:#39ff14;color:#0a1a0a;cursor:pointer;font-weight:bold;box-shadow:0 4px 0 #1a7a0a}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #1a7a0a}
#gameCanvas{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh}
#hud{position:fixed;top:10px;left:0;width:100%;display:none;justify-content:space-between;padding:0 14px;font-weight:bold;z-index:5;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.7);font-size:.82em}
#hud span{background:rgba(0,0,0,.5);padding:7px 11px;border-radius:10px;backdrop-filter:blur(4px)}
#dashBtn{position:fixed;right:16px;bottom:16px;z-index:6;display:none;padding:14px 22px;border-radius:14px;background:#ffd700;color:#000;box-shadow:0 4px 0 #b89600;font-size:1em}
#dashBtn:disabled{opacity:.45}
#dashBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #b89600}
#shieldIcon{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);z-index:6;display:none;background:rgba(0,200,255,.9);color:#000;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:.8em}
#gameOver{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;background:rgba(0,0,0,.88);position:fixed;top:0;left:0;width:100vw;z-index:20;padding:20px;overflow-y:auto}
#gameOver h1{font-size:2em;color:#39ff14;margin-bottom:8px}
#gameOver .score{font-size:1.4em;color:#fff;margin-bottom:6px}
.ranking{width:100%;max-width:340px;margin:12px 0;background:rgba(255,255,255,.06);border:1px solid rgba(57,255,20,.25);border-radius:12px;padding:12px}
.ranking h3{font-size:.92em;color:#39ff14;text-align:center;margin-bottom:8px}
.ranking ol{list-style:none}
.ranking li{display:flex;justify-content:space-between;padding:6px 8px;border-radius:8px;font-size:.88em}
.ranking li.me{background:rgba(57,255,20,.15);font-weight:bold}
#instructions{font-size:.75em;color:#b0ff9a;margin-top:10px;line-height:1.4;max-width:340px}
</style>
</head>
<body>
<div id="menu">
  <h1>TSUNAMI Z</h1>
  <p class="sub">Proyecto U — Power-ups + habilidades</p>
  <input id="nameInput" placeholder="Tu nombre" maxlength="15" autocomplete="off">
  <button id="playBtn">JUGAR</button>
  <div id="instructions">Corto = salto · Mantén = flotar<br><b style="color:#39ff14">Verde GIGANTE 5s</b> rompe muros · <b style="color:#ffd700">Estrella</b> invencible · <b style="color:#00d4ff">Escudo</b> 1 golpe · <b>DASH →</b> botón / doble toque / Shift</div>
  <div class="ranking" id="menuRanking"></div>
</div>
<canvas id="gameCanvas"></canvas>
<div id="hud"><span id="hudLeft"></span><span id="hudCenter"></span><span id="hudRight"></span></div>
<button id="dashBtn">DASH →</button>
<div id="shieldIcon">ESCUDO ACTIVO</div>
<div id="gameOver">
  <h1>HORDA DEVORADA</h1>
  <p class="score" id="goScore"></p>
  <p id="goZombies" style="color:#39ff14"></p>
  <p id="goCoins" style="color:#ffd700"></p>
  <div class="ranking" id="goRanking"></div>
  <button id="restartBtn">Jugar de nuevo</button>
  <button id="menuBtn" style="margin-top:10px;background:transparent;border:2px solid #39ff14;color:#39ff14">Menú</button>
</div>
<script>
const canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d');
const menu=document.getElementById('menu'), hud=document.getElementById('hud'), hudLeft=document.getElementById('hudLeft'), hudCenter=document.getElementById('hudCenter'), hudRight=document.getElementById('hudRight');
const goScore=document.getElementById('goScore'), goZombies=document.getElementById('goZombies'), goCoins=document.getElementById('goCoins');
const nameInput=document.getElementById('nameInput'), playBtn=document.getElementById('playBtn'), restartBtn=document.getElementById('restartBtn'), menuBtn=document.getElementById('menuBtn');
const dashBtn=document.getElementById('dashBtn'), shieldIcon=document.getElementById('shieldIcon');
const menuRanking=document.getElementById('menuRanking'), goRanking=document.getElementById('goRanking'), gameOverScreen=document.getElementById('gameOver');
let W,H,player,pedestrians=[],obstacles=[],coins=[],powerUps=[],particles=[],score=0,coinsCollected=0,gameRunning=false,animId,speed=3.8,holding=false,tick=0,bgOffset=0;
const GRAVITY=0.52,HOVER_GRAVITY=0.20,JUMP=-12.6,DOUBLE_JUMP=-11.2,GROUND_RATIO=0.16,MAX_JUMPS=2;
const zFrames=[], pFrames=[];
for(let i=1;i<=6;i++){ const iz=new Image(); iz.src=`assets/z_walk_${i}.png`; zFrames.push(iz); const ip=new Image(); ip.src=`assets/p_walk_${i}.png`; pFrames.push(ip); }

let ac;
function getAc(){if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac;}
function sndJump(d){try{const a=getAc(),o=a.createOscillator(),g=a.createGain();o.frequency.value=d?520:360;o.connect(g);g.connect(a.destination);g.gain.value=0.16;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.18);o.frequency.exponentialRampToValueAtTime(d?820:620,a.currentTime+0.1);o.stop(a.currentTime+0.19)}catch(e){}}
function sndCoin(){try{const a=getAc();[659,880].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=0.13;const t=a.currentTime+i*0.08;o.start(t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);o.stop(t+0.18)})}catch(e){}}
function sndEat(){try{const a=getAc(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=300;o.connect(g);g.connect(a.destination);g.gain.value=0.18;o.start();o.frequency.linearRampToValueAtTime(900,a.currentTime+0.12);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.18);o.stop(a.currentTime+0.19)}catch(e){}}
function sndHit(){try{const a=getAc(),o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=140;o.connect(g);g.connect(a.destination);g.gain.value=0.18;o.start();o.frequency.linearRampToValueAtTime(60,a.currentTime+0.22);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.24);o.stop(a.currentTime+0.25)}catch(e){}}
function sndPower(){try{const a=getAc();[523,659,784,1046].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=0.12;const t=a.currentTime+i*0.07;o.start(t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);o.stop(t+0.15)})}catch(e){}}
function sndDash(){try{const a=getAc(),o=a.createOscillator(),g=a.createGain();o.frequency.value=200;o.connect(g);g.connect(a.destination);g.gain.value=0.18;o.start();o.frequency.exponentialRampToValueAtTime(800,a.currentTime+0.18);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.2);o.stop(a.currentTime+0.2)}catch(e){}}

const KEY='tsunami_z_ranking';
function loadRank(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function saveRank(name, sc){
  const list=loadRank(); list.push({name,score:Math.floor(sc),date:Date.now()});
  const m=new Map(); for(const e of list){const c=m.get(e.name); if(!c||e.score>c.score) m.set(e.name,e)}
  const best=[...m.values()].sort((a,b)=>b.score-a.score).slice(0,10);
  localStorage.setItem(KEY,JSON.stringify(best)); return best;
}
function renderRank(el,hl){
  const l=loadRank();
  if(l.length===0){el.innerHTML='<h3>Ranking</h3><p style="color:#777;font-size:.85em">Aun sin partidas</p>';return}
  let h='<h3>Ranking Top 10</h3><ol>'; l.forEach((e,i)=>{h+=`<li${e.name===hl?' class="me"':''}><span>${i+1}. ${e.name}</span><span>${e.score}m</span></li>`}); h+='</ol>'; el.innerHTML=h;
}
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize(); addEventListener('resize',resize); renderRank(menuRanking);

function init(n){
  resize(); tick=0; bgOffset=0;
  player={x:W*0.13,y:H*(1-GROUND_RATIO)-36,w:36,h:36,vy:0,grounded:true,jumps:0,name:n,horde:4, giant:0, star:0, shield:true, shieldCD:0, dashCD:0, dashing:0};
  pedestrians=[]; obstacles=[]; coins=[]; powerUps=[]; particles=[]; score=0; coinsCollected=0; speed=3.8; holding=false;
  gameOverScreen.style.display='none'; menu.style.display='none'; canvas.style.display='block'; hud.style.display='flex'; dashBtn.style.display='block'; shieldIcon.style.display= player.shield ? 'block' : 'none';
  getAc(); updateHud();
}
function updateHud(){
  let mid='';
  if(player.giant>0) mid+=` GIGANTE ${Math.ceil(player.giant/60)}s`;
  if(player.star>0) mid+=` ESTRELLA ${Math.ceil(player.star/60)}s`;
  if(player.dashing>0) mid+=` DASH!`;
  hudLeft.textContent=`${player.name} · ${Math.floor(score)}m`;
  hudCenter.textContent=mid.trim();
  hudRight.textContent=`Zombies: ${player.horde} · Monedas: ${coinsCollected}`;
  dashBtn.disabled = player.dashCD>0 || player.dashing>0;
  dashBtn.textContent = player.dashCD>0 ? `DASH ${Math.ceil(player.dashCD/60)}s` : 'DASH →';
  shieldIcon.style.display = player.shield ? 'block' : 'none';
  shieldIcon.textContent = player.shield ? 'ESCUDO' : `Escudo ${Math.ceil(player.shieldCD/60)}s`;
  shieldIcon.style.background = player.shield ? 'rgba(0,200,255,.9)' : 'rgba(255,60,60,.7)';
}

function drawBg(){
  const gy=H*(1-GROUND_RATIO);
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#050d05'); g.addColorStop(0.55,'#0f2a0f'); g.addColorStop(1,'#1a331a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.shadowColor='rgba(255,255,160,.6)'; ctx.shadowBlur=18;
  ctx.fillStyle='rgba(255,255,180,.95)'; ctx.beginPath(); ctx.arc(W*0.84, 72, 24,0,Math.PI*2); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(W*0.84+5,68,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)'; for(let i=0;i<12;i++){ const x=(i*137 + bgOffset*0.1)%W; const y=20+(i*37)%90; ctx.fillRect(x,y,1.5,1.5); }
  ctx.fillStyle='#0b1e0b';
  for(let layer=0;layer<2;layer++){
    const off = (bgOffset*(0.3+layer*0.3))%90;
    ctx.beginPath(); ctx.moveTo(-off,gy);
    for(let x=-off;x<=W+90;x+=38+layer*12){
      const h = 28+Math.sin(x*0.05)*10 + (x%90<40?16:0) + layer*12;
      ctx.lineTo(x,gy-h); ctx.lineTo(x+18,gy-h); ctx.lineTo(x+18,gy);
    }
    ctx.lineTo(W,gy); ctx.fill();
    ctx.fillStyle= layer===0?'rgba(57,255,20,.18)':'rgba(57,255,20,.08)';
    for(let x=10-off;x<W;x+=38){ for(let wy=gy-18; wy>gy-38; wy-=10){ if(Math.random()>0.6) ctx.fillRect(x+4,wy,4,5);} }
    ctx.fillStyle='#0b1e0b';
  }
  ctx.fillStyle='#1c1c1c'; ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#39ff14'; ctx.shadowColor='#39ff14'; ctx.shadowBlur=8; ctx.fillRect(0,gy,W,3); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.06)'; for(let x=(bgOffset*1.2)%40-40;x<W;x+=40) ctx.fillRect(x,gy+8,18,2);
}

function drawZombieSprite(x,y,phase,isLeader,inAir,holding){
  const bob = inAir ? 0 : Math.sin(phase)*2;
  const ty=y+bob;
  if(!inAir){ ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x+7, y+16, 7,3,0,0,Math.PI*2); ctx.fill(); }
  const idx = Math.floor(phase*1.4) % 6;
  const img = zFrames[idx];
  const isGiant = player.giant>0;
  const scale = isGiant ? 1.5 : 1;
  if(img && img.complete && img.naturalWidth>0){
    ctx.save();
    if(inAir && holding){ ctx.translate(x+7, ty+8); ctx.rotate(-0.1); ctx.translate(-x-7, -ty-8); }
    const dw=30*scale, dh=36*scale;
    try{ ctx.drawImage(img, x-8, ty-14 - (isGiant?8:0), dw, dh); }catch(e){}
    if(isGiant){ ctx.shadowColor='#39ff14'; ctx.shadowBlur=10; ctx.strokeStyle='rgba(57,255,20,.9)'; ctx.lineWidth=2; ctx.strokeRect(x-8,ty-14-8,dw,dh); ctx.shadowBlur=0; }
    else if(isLeader){ ctx.strokeStyle='rgba(57,255,20,.85)'; ctx.lineWidth=1.5; ctx.strokeRect(x-8,ty-14,30,36); }
    ctx.restore(); return;
  }
  ctx.save();
  if(inAir&&holding){ctx.translate(x+7,ty+8);ctx.rotate(-0.12);ctx.translate(-x-7,-ty-8);}
  ctx.fillStyle=isGiant?'#7CFF7C':'#2ecc71'; ctx.fillRect(x,ty,14*scale,12*scale);
  ctx.restore();
}

function drawHorde(){
  const baseX=player.x, baseY=player.y; const inAir=!player.grounded;
  const starOn = player.star>0 && Math.floor(tick/4)%2===0;
  if(player.star>0 || player.dashing>0 || player.shield){
    ctx.save(); ctx.strokeStyle= player.star>0?'#ffd700': player.dashing>0?'#ff6b00':'rgba(0,200,255,.6)';
    ctx.lineWidth= player.star>0?3:2; ctx.setLineDash(player.dashing>0?[6,4]:[]);
    ctx.strokeRect(baseX-8, baseY-14 - (player.giant>0?8:0), 36+player.horde*2, 44); ctx.restore();
  }
  if(starOn){ ctx.fillStyle='rgba(255,215,0,.18)'; ctx.fillRect(baseX-10,baseY-18,48,52); }
  for(let i=0;i<player.horde;i++){
    const col=i%4, row=Math.floor(i/4);
    const x=baseX+col*11-(player.horde>6?8:0)+Math.sin(tick*0.08+i)*0.6;
    const y=baseY-row*12;
    const phase=tick*0.55+i*0.9;
    drawZombieSprite(x,y,phase,i===0,inAir,holding);
  }
}

function drawPedestrians(){
  pedestrians.forEach(p=>{
    if(p.eaten) return;
    const phase = tick*0.45 + p.x*0.02;
    const bob = Math.sin(phase)*1.4;
    const idx = Math.floor(phase*1.1)%6;
    const img=pFrames[idx];
    if(img && img.complete && img.naturalWidth>0){
      const x=p.x-6, y=p.y-14+bob;
      ctx.save(); ctx.scale(-1,1); ctx.drawImage(img, -(x+18), y, 24,30); ctx.restore();
      ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(p.x+8,p.y+p.h,6,2,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff1a1a'; ctx.font='bold 9px Arial'; ctx.textAlign='center'; ctx.fillText('!',p.x+8,p.y-12+bob);
      return;
    }
    const x=p.x, y=p.y+bob; ctx.fillStyle='#5dade2'; ctx.fillRect(x,y,p.w,p.h);
  });
}

function drawObstacles(){
  obstacles.forEach(o=>{
    if(o.type==='bomb'){
      const bob=Math.sin(tick*0.25+o.x*0.01)*1.5; const y=o.y+bob; ctx.save();
      ctx.strokeStyle='#ffd700'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(o.x+o.w/2, y); ctx.lineTo(o.x+o.w/2+4, y-6); ctx.stroke();
      ctx.fillStyle='#ff6b00'; ctx.beginPath(); ctx.arc(o.x+o.w/2+4, y-6, 2.5+Math.sin(tick*0.6)*1,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#0a0a0a'; ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(o.x+o.w/2, y+o.h/2+4, o.w/2,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#ff1a1a'; ctx.font='bold 10px Arial'; ctx.textAlign='center'; ctx.fillText('!',o.x+o.w/2, y+o.h/2+7); ctx.restore();
    } else if(o.type==='aerial'){
      const bob=Math.sin(tick*0.35+o.x*0.02)*5; const y=o.y+bob;
      ctx.save();
      // drone aereo con helices
      ctx.fillStyle='#4a00b5'; ctx.fillRect(o.x,y,o.w,o.h);
      ctx.fillStyle='#7a00ff'; ctx.fillRect(o.x+2,y+2,o.w-4,4);
      ctx.fillStyle='rgba(255,255,255,.75)'; ctx.beginPath(); ctx.ellipse(o.x+o.w/2, y, o.w*0.55,3,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff1a1a'; ctx.font='bold 9px Arial'; ctx.textAlign='center'; ctx.fillText('▲', o.x+o.w/2, y+o.h/2+3);
      ctx.restore();
      o._drawY=y; // guarda y con bob para colision
    } else {
      ctx.fillStyle='#3a3a3a'; ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#39ff14'; ctx.shadowColor='#39ff14'; ctx.shadowBlur=6; ctx.fillRect(o.x,o.y-3,o.w,3); ctx.shadowBlur=0;
    }
  });
}

function drawCoins(){
  coins.forEach(c=>{
    if(c.collected) return; ctx.save(); const bob=Math.sin(tick*0.12 + c.x*0.01)*3; const spin=Math.abs(Math.cos(tick*0.14 + c.x*0.02));
    const cx=c.x+c.w/2, cy=c.y+c.h/2+bob; ctx.translate(cx,cy); ctx.scale(spin,1);
    ctx.fillStyle='#ffd700'; ctx.strokeStyle='#ff8c00'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,c.w/2,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(-3,-4,4,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff8c00'; ctx.font='bold 12px Arial'; ctx.textAlign='center'; ctx.fillText('$',0,4); ctx.restore();
  });
}

function drawPowerUps(){
  powerUps.forEach(p=>{
    const bob=Math.sin(tick*0.15 + p.x*0.01)*4;
    const y=p.y+bob;
    ctx.save();
    ctx.shadowBlur=10; ctx.shadowColor= p.type==='giant' ? '#39ff14' : '#ffd700';
    if(p.type==='giant'){
      ctx.fillStyle='#39ff14'; ctx.beginPath(); ctx.arc(p.x+p.w/2, y+p.h/2, p.w/2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000'; ctx.font='bold 16px Arial'; ctx.textAlign='center'; ctx.fillText('G', p.x+p.w/2, y+p.h/2+5);
      ctx.fillStyle='#fff'; ctx.font='7px Arial'; ctx.fillText('GIGANTE', p.x+p.w/2, y+p.h+10);
    } else {
      ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(p.x+p.w/2, y+p.h/2, p.w/2,0,Math.PI*2); ctx.fill();
      // estrella
      ctx.fillStyle='#ff8c00'; ctx.font='bold 16px Arial'; ctx.textAlign='center'; ctx.fillText('★', p.x+p.w/2, y+p.h/2+5);
      ctx.fillStyle='#fff'; ctx.font='7px Arial'; ctx.fillText('ESTRELLA', p.x+p.w/2, y+p.h+10);
    }
    ctx.restore();
  });
}
function drawParticles(){ particles.forEach(p=>{ ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.font='bold 13px Arial'; ctx.fillText(p.text,p.x,p.y); }); ctx.globalAlpha=1; }

function doDash(){
  if(!gameRunning || player.dashCD>0 || player.dashing>0) return;
  player.dashing=24; // ~0.4s a 60fps
  player.dashCD=180; // 3s cooldown
  player.vy = -3; // pequeño salto al dashear
  sndDash();
  particles.push({x:player.x,y:player.y,vy:-1,vx:0,life:1,text:'DASH!',color:'#ff6b00'});
}

function update(){
  if(!gameRunning) return;
  tick++; bgOffset+=speed*0.6;
  // timers
  if(player.giant>0) player.giant--;
  if(player.star>0) player.star--;
  if(player.dashing>0) player.dashing--;
  if(player.dashCD>0) player.dashCD--;
  if(player.shieldCD>0){ player.shieldCD--; if(player.shieldCD<=0) player.shield=true; }
  const isInvincible = player.giant>0 || player.star>0 || player.dashing>0;
  speed=3.8 + Math.floor(score/220)*0.2 + (player.dashing>0?3:0);
  if(player.grounded) score+=speed*0.18;
  // si gigante/estrella, también sumas en aire un poco
  if(isInvincible && !player.grounded) score+=speed*0.08;
  updateHud();
  if(!player.grounded){
    const g=holding?HOVER_GRAVITY:GRAVITY; if(holding&&player.vy>2) player.vy=2; player.vy+=g; player.y+=player.vy;
    const gy=H*(1-GROUND_RATIO)-player.h; if(player.y>=gy){player.y=gy;player.vy=0;player.grounded=true;player.jumps=0; for(let i=0;i<4;i++) particles.push({x:player.x+10+Math.random()*20,y:gy,vy:-1-Math.random()*2,vx:(Math.random()-0.5)*3,life:1,text:'·',color:'rgba(57,255,20,.7)'}); } if(player.y<0){player.y=0;player.vy=0}
  }
  if(Math.random()<0.018){
    const gy=H*(1-GROUND_RATIO); const h=20+Math.random()*8, w=16; const y=gy-h; const cnt=1+(Math.random()<0.28?1:0);
    for(let i=0;i<cnt;i++) pedestrians.push({x:W+10+i*20,y:y,w:w,h:h,eaten:false});
  }
  if(Math.random()<0.010){
    const gy=H*(1-GROUND_RATIO); const isBomb=Math.random()<0.45; const w=isBomb?22:28, h=isBomb?22:18+Math.random()*12;
    obstacles.push({x:W+10,y:gy-h,w:w,h:h,type:isBomb?'bomb':'wall'});
  }
  if(Math.random()<0.006){
    const gy=H*(1-GROUND_RATIO); const y=gy-75-Math.random()*70;
    const w=28+Math.random()*12, h=14+Math.random()*8;
    obstacles.push({x:W+10,y:y,w:w,h:h,type:'aerial'});
  }
  if(Math.random()<0.035){
    const gy=H*(1-GROUND_RATIO); const y=gy-55-Math.random()*45; coins.push({x:W+10,y:y,w:24,h:24,collected:false});
  }
  if(Math.random()<0.007){
    const gy=H*(1-GROUND_RATIO); const type=Math.random()<0.5?'giant':'star'; const y=gy-70-Math.random()*60;
    powerUps.push({x:W+10,y:y,w:26,h:26,type:type});
  }
  const spd = isInvincible ? speed*1.05 : speed;
  const dashSpd = player.dashing>0 ? 8 : 0;
  pedestrians.forEach(p=> p.x-=spd + dashSpd);
  obstacles.forEach(o=> o.x-=spd + dashSpd);
  coins.forEach(c=> c.x-=spd);
  powerUps.forEach(p=> p.x-=spd);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life-=0.03; });
  particles=particles.filter(p=>p.life>0);

  // power-ups colision
  powerUps.forEach(p=>{
    if(player.x < p.x+p.w && player.x+player.w > p.x && player.y < p.y+p.h && player.y+player.h > p.y){
      p.x=-100;
      if(p.type==='giant'){ player.giant=300; sndPower(); particles.push({x:p.x,y:p.y,vy:-2,vx:0,life:1,text:'GIGANTE!',color:'#39ff14'}); }
      else { player.star=300; sndPower(); particles.push({x:p.x,y:p.y,vy:-2,vx:0,life:1,text:'ESTRELLA!',color:'#ffd700'}); }
    }
  });

  pedestrians.forEach(p=>{
    if(!p.eaten && player.x < p.x+p.w && player.x+player.w+ (player.horde*1.4) > p.x && player.y < p.y+p.h+10 && player.y+player.h > p.y){
      // dash también come todo en el camino
      p.eaten=true; player.horde += 1; score+=15; sndEat();
      particles.push({x:p.x,y:p.y,vy:-2.2,vx:0,life:1,text:'+1',color:'#39ff14'});
    }
  });
  // dash rompe todo automaticamente: si dasheando, comer peatones ya se hizo, y obstáculos se destruyen sin daño
  if(player.dashing>0){
    obstacles.forEach(o=>{
      if(player.x+player.w+18>o.x && player.x < o.x+o.w && player.y+player.h > o.y){
        o.x=-100; score+=5; particles.push({x:o.x,y:o.y,vy:-1,vx:0,life:1,text:'ROMPE!',color:'#ff6b00'});
      }
    });
  }
  // cualquier zombie de la horda puede recoger monedas
  const displayForCollect = Math.min(player.horde, 12);
  coins.forEach(c=>{
    if(c.collected) return;
    let hit=false;
    for(let i=0;i<displayForCollect;i++){
      const col=i%4, row=Math.floor(i/4);
      const zx=player.x+col*11-(displayForCollect>6?8:0);
      const zy=player.y-row*12;
      if(zx-8 < c.x+c.w && zx+30 > c.x && zy-14 < c.y+c.h && zy+26 > c.y){ hit=true; break; }
    }
    if(hit){
      c.collected=true; coinsCollected++; score+=10; sndCoin();
      particles.push({x:c.x,y:c.y,vy:-1.8,vx:0,life:1,text:'+10',color:'#ffd700'});
    }
  });
  const pr=6;
  let blocked=false;
  for(const o of obstacles){
    const oy = o._drawY!==undefined ? o._drawY : o.y;
    const inv = player.giant>0 || player.star>0 || player.dashing>0;
    // MURO SOLIDO: bloquea solo si estas en el suelo, si saltas pasas
    if(o.type==='wall'){
      const touching = player.x+player.w-pr>o.x && player.x+pr<o.x+o.w && player.y+player.h-pr>oy && player.y+pr<oy+o.h;
      if(touching){
        if(inv){ o.x=-100; score+=8; particles.push({x:o.x,y:oy,vy:-1,vx:0,life:1,text:'BLOCK!',color:'#39ff14'}); continue; }
        // si estas en el aire, no bloquea - solo deja pasar
        if(!player.grounded){
          // si ya lo pasaste, marca y elimina
          if(player.x > o.x+o.w){ o.x=-100; score+=8; particles.push({x:o.x,y:oy,vy:-1,vx:0,life:1,text:'+8',color:'#39ff14'}); }
          continue;
        }
        // en el suelo y tocando -> bloquea
        if(player.shield){
          player.shield=false; player.shieldCD=360;
          o.x=-100; sndHit(); particles.push({x:player.x,y:player.y-10,vy:-2,vx:0,life:1,text:'ESCUDO!',color:'#00d4ff'});
          continue;
        }
        blocked=true;
        player.x = Math.min(player.x, o.x - player.w - 1);
        if(player.x < -12){
          gameRunning=false; cancelAnimationFrame(animId); dashBtn.style.display='none'; shieldIcon.style.display='none';
          const best=saveRank(player.name,score); goScore.textContent=Math.floor(score)+' m'; goZombies.textContent='Horda aplastada por muro'; goCoins.textContent='Monedas: '+coinsCollected; renderRank(goRanking,player.name); renderRank(menuRanking,player.name); gameOverScreen.style.display='flex'; return;
        }
        continue;
      }
      // muro superado por haberlo saltado y ya paso de largo
      if(player.x > o.x+o.w && o.x+o.w>0){ o.x=-100; score+=8; particles.push({x:o.x,y:oy,vy:-1,vx:0,life:1,text:'+8',color:'#39ff14'}); }
      continue;
    }
    // bombas y aéreos: daño directo
    if(player.x+player.w-pr>o.x && player.x+pr<o.x+o.w && player.y+player.h-pr>oy && player.y+pr<oy+o.h){
      if(inv){ o.x=-100; score+=5; particles.push({x:o.x,y:o.y,vy:-1,vx:0,life:1,text:'BLOCK!',color:'#39ff14'}); continue; }
      if(player.shield){ player.shield=false; player.shieldCD=360; o.x=-100; sndHit(); particles.push({x:player.x,y:player.y-10,vy:-2,vx:0,life:1,text:'ESCUDO!',color:'#00d4ff'}); canvas.style.transform='translate(1px,0)'; setTimeout(()=>canvas.style.transform='',80); continue; }
      o.x=-100;
      if(o.type==='bomb'){ player.horde=Math.max(0,player.horde-3); particles.push({x:o.x+12,y:oy,vy:-2,vx:0,life:1,text:'-3',color:'#ff1a1a'}); sndHit(); }
      else if(o.type==='aerial'){ player.horde=Math.max(0,player.horde-2); particles.push({x:o.x+12,y:oy,vy:-2,vx:0,life:1,text:'-2',color:'#a020f0'}); sndHit(); }
      else { player.horde=Math.max(0,player.horde-1); particles.push({x:o.x+12,y:oy,vy:-2,vx:0,life:1,text:'-1',color:'#ff6b6b'}); sndHit(); }
      canvas.style.transform='translate(2px,0)'; setTimeout(()=>canvas.style.transform='',60);
      if(player.horde<=0){ gameRunning=false; cancelAnimationFrame(animId); dashBtn.style.display='none'; shieldIcon.style.display='none'; const best=saveRank(player.name,score); goScore.textContent=Math.floor(score)+' m'; goZombies.textContent='Horda final: '+player.horde; goCoins.textContent='Monedas: '+coinsCollected; renderRank(goRanking,player.name); renderRank(menuRanking,player.name); gameOverScreen.style.display='flex'; return; }
    }
  }
  // si no bloqueado, la horda avanza lentamente al centro
  if(!blocked && player.x < W*0.13){ player.x = Math.min(W*0.13, player.x+2); }
  pedestrians=pedestrians.filter(p=>!p.eaten && p.x+p.w>-30);
  obstacles=obstacles.filter(o=>o.x+o.w>-40);
  coins=coins.filter(c=>!c.collected && c.x+c.w>-30);
  powerUps=powerUps.filter(p=>p.x+p.w>-30);
  drawBg(); drawCoins(); drawPowerUps(); drawPedestrians(); drawObstacles(); drawHorde(); drawParticles();
}
function drawHorde(){
  const baseX=player.x, baseY=player.y; const inAir=!player.grounded;
  const display = Math.min(player.horde, 12);
  // efecto serpiente: cada zombie sigue la onda del lider con retardo
  for(let i=0;i<display;i++){
    const col=i%4, row=Math.floor(i/4);
    const delay = i*0.45;
    const wave = Math.sin(tick*0.14 - delay)*4.5 + Math.sin(tick*0.08+i)*0.8;
    const x=baseX+col*11-(display>6?8:0);
    const y=baseY-row*12 + wave + (inAir? Math.sin(tick*0.2-delay)*1.5 : 0);
    const phase=tick*0.55+i*0.9;
    drawZombieSprite(x,y,phase,i===0,inAir,holding);
  }
  if(player.horde>12){
    ctx.fillStyle='rgba(0,0,0,.65)'; ctx.fillRect(baseX+14, baseY-38, 28,14);
    ctx.fillStyle='#39ff14'; ctx.font='bold 10px Arial'; ctx.textAlign='center'; ctx.fillText(`+${player.horde-12}`, baseX+28, baseY-28);
  }
}
function jump(){
  if(!gameRunning||!player) return;
  if(player.jumps>=MAX_JUMPS) return;
  const d=player.jumps===1; player.vy=d?DOUBLE_JUMP:JUMP; player.grounded=false; player.jumps++; sndJump(d);
}
function startLoop(){ function loop(){update(); if(gameRunning) animId=requestAnimationFrame(loop)} loop()}
function showMenu(){ gameRunning=false; cancelAnimationFrame(animId); gameOverScreen.style.display='none'; canvas.style.display='none'; hud.style.display='none'; dashBtn.style.display='none'; shieldIcon.style.display='none'; menu.style.display='flex'; renderRank(menuRanking, nameInput.value.trim()||null); }

playBtn.addEventListener('click',()=>{const n=nameInput.value.trim()||'Jugador'; init(n); gameRunning=true; startLoop()});
restartBtn.addEventListener('click',()=>{ init(player?player.name:'Jugador'); gameRunning=true; startLoop()});
menuBtn.addEventListener('click',showMenu);
dashBtn.addEventListener('click',doDash);
dashBtn.addEventListener('touchstart',e=>{e.preventDefault(); doDash();},{passive:false});
function setHold(v){holding=v; if(gameRunning) updateHud();}
document.addEventListener('keydown',e=>{
  if(e.code==='ShiftLeft' || e.code==='ShiftRight'){ doDash(); e.preventDefault(); return; }
  if((e.code==='Space'||e.code==='ArrowUp')&&gameRunning){ if(e.repeat){setHold(true);return} jump(); setHold(true); e.preventDefault(); }
});
document.addEventListener('keyup',e=>{ if(e.code==='Space'||e.code==='ArrowUp') setHold(false);});
// doble toque para dash en canvas
let lastTap=0;
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault(); if(!gameRunning) return;
  const now=Date.now();
  if(now-lastTap<300){ doDash(); }
  lastTap=now;
  jump(); setHold(true); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup',e=>{e.preventDefault(); setHold(false);});
canvas.addEventListener('pointercancel',()=>{setHold(false);});
canvas.addEventListener('pointerleave',()=>{setHold(false);});
</script>
