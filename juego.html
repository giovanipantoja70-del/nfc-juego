<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Jump Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#1a1a2e;color:#fff;overflow:hidden;touch-action:manipulation}
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;padding:20px;position:relative;z-index:10;background:#1a1a2e}
#menu h1{font-size:2.2em;margin-bottom:10px;color:#e94560}
#menu p{font-size:1em;margin-bottom:25px;color:#aaa}
#menu input{width:80%;max-width:280px;padding:14px 18px;font-size:1.1em;border:2px solid #e94560;border-radius:12px;background:transparent;color:#fff;outline:none;text-align:center;margin-bottom:25px}
#menu input:focus{border-color:#ff6b81}
button{padding:14px 50px;font-size:1.2em;border:none;border-radius:12px;background:#e94560;color:#fff;cursor:pointer;font-weight:bold}
button:active{transform:scale(0.97)}
#gameCanvas{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:1.1em;font-weight:bold;color:#fff;z-index:5;text-shadow:0 2px 4px rgba(0,0,0,.7);display:none}
#gameOver{display:none;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;background:rgba(0,0,0,.82);position:fixed;top:0;left:0;width:100vw;z-index:20}
#gameOver h1{font-size:2em;color:#e94560;margin-bottom:10px}
#gameOver p{font-size:1.1em;margin-bottom:8px;color:#ccc}
#gameOver .score{font-size:1.8em;color:#ffd700;font-weight:bold;margin-bottom:20px}
#instructions{font-size:.85em;color:#888;margin-top:15px}
</style>
</head>
<body>
<div id="menu">
  <h1>🏃 Salta Obstaculos</h1>
  <p>Supera tu record!</p>
  <input type="text" id="nameInput" placeholder="Tu nombre" maxlength="15" autocomplete="off">
  <button id="playBtn">¡Jugar!</button>
  <div id="instructions">Toca la pantalla o presiona espacio para saltar</div>
</div>
<canvas id="gameCanvas"></canvas>
<div id="hud"></div>
<div id="gameOver">
  <h1>Game Over!</h1>
  <p>Jugador: <span id="goName"></span></p>
  <p class="score" id="goScore"></p>
  <button id="restartBtn">Jugar de nuevo</button>
</div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const menu=document.getElementById('menu');
const hud=document.getElementById('hud');
const gameOverScreen=document.getElementById('gameOver');
const goName=document.getElementById('goName');
const goScore=document.getElementById('goScore');
const nameInput=document.getElementById('nameInput');
const playBtn=document.getElementById('playBtn');
const restartBtn=document.getElementById('restartBtn');
let W,H,player,obstacles=[],score=0,gameRunning=false,animId,speed=5,obstaclesPassed=0;
const GRAVITY=0.7,JUMP_FORCE=-13,GROUND_RATIO=0.15;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);
function initGame(playerName){
  resize();
  player={x:W*0.15,y:H*(1-GROUND_RATIO)-45,w:35,h:45,vy:0,grounded:true,name:playerName};
  obstacles=[];score=0;speed=5;obstaclesPassed=0;
  gameOverScreen.style.display='none';
  menu.style.display='none';
  canvas.style.display='block';
  hud.style.display='block';
  hud.textContent=player.name+' - 0m';
  drawBg();drawPlayer();
}
function drawBg(){
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1a1a2e');grad.addColorStop(1,'#16213e');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  const groundY=H*(1-GROUND_RATIO);
  ctx.fillStyle='#0f3460';ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='#e94560';ctx.fillRect(0,groundY,W,4);
  ctx.fillStyle='#1f2d45';ctx.beginPath();ctx.moveTo(0,groundY);
  for(let i=0;i<=W;i+=40){ctx.lineTo(i,groundY-30-Math.sin(i*0.01)*25-Math.sin(i*0.025)*15)}
  ctx.lineTo(W,groundY);ctx.fill();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function drawPlayer(){
  ctx.fillStyle='#e94560';roundRect(player.x,player.y,player.w,player.h,8);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x+player.w*0.62,player.y+13,6,0,Math.PI*2);ctx.arc(player.x+player.w*0.85,player.y+13,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(player.x+player.w*0.64,player.y+13,2.5,0,Math.PI*2);ctx.arc(player.x+player.w*0.87,player.y+13,2.5,0,Math.PI*2);ctx.fill();
}
function drawObstacles(){
  obstacles.forEach(o=>{
    if(o.type==='spike'){ctx.fillStyle='#ffd700';ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill()}
    else{ctx.fillStyle='#0f3460';ctx.strokeStyle='#e94560';ctx.lineWidth=3;roundRect(o.x,o.y,o.w,o.h,6);ctx.fill();ctx.stroke();ctx.fillStyle='#e94560';ctx.beginPath();ctx.arc(o.x+o.w*0.32,o.y+o.h*0.32,4,0,Math.PI*2);ctx.arc(o.x+o.w*0.68,o.y+o.h*0.32,4,0,Math.PI*2);ctx.fill()}
  });
}
function update(){
  if(!gameRunning) return;
  speed=5+obstaclesPassed*0.28;
  score+=speed*0.16;
  hud.textContent=player.name+' - '+Math.floor(score)+'m';
  if(!player.grounded){player.vy+=GRAVITY;player.y+=player.vy;const gy=H*(1-GROUND_RATIO)-player.h;if(player.y>=gy){player.y=gy;player.vy=0;player.grounded=true}}
  if(Math.random()<0.018){const type=Math.random()<0.4?'spike':'box';const groundY=H*(1-GROUND_RATIO);const w=26+Math.random()*14;const h=type==='spike'?38:28+Math.random()*22;obstacles.push({x:W+10,y:groundY-h,w:w,h:h,type:type,passed:false});if(type==='box') obstaclesPassed++}
  obstacles.forEach(o=>{o.x-=speed;if(!o.passed&&o.x+o.w<player.x){o.passed=true;if(o.type==='box') score+=5}});
  obstacles=obstacles.filter(o=>o.x+o.w>-40);
  const pr=6;
  for(const o of obstacles){if(player.x+player.w-pr>o.x&&player.x+pr<o.x+o.w&&player.y+player.h-pr>o.y&&player.y+pr<o.y+o.h){gameRunning=false;cancelAnimationFrame(animId);goName.textContent=player.name;goScore.textContent=Math.floor(score)+'m';gameOverScreen.style.display='flex';return}}
  drawBg();drawObstacles();drawPlayer();
}
function jump(){if(gameRunning&&player&&player.grounded){player.vy=JUMP_FORCE;player.grounded=false}}
function startLoop(){function loop(){update();if(gameRunning) animId=requestAnimationFrame(loop)} loop()}
playBtn.addEventListener('click',()=>{const n=nameInput.value.trim()||'Jugador';initGame(n);gameRunning=true;startLoop()});
restartBtn.addEventListener('click',()=>{const n=goName.textContent||'Jugador';initGame(n);gameRunning=true;startLoop()});
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&gameRunning){e.preventDefault();jump()}});
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});
document.addEventListener('touchstart',e=>{if(gameRunning&&e.target!==playBtn&&e.target!==restartBtn){const t=e.target;if(t===canvas||t===hud) return; // permitir tocar cualquier parte durante juego
  // si tocan fuera del canvas igual saltar
  if(canvas.style.display==='block') jump()}},{passive:false});
canvas.addEventListener('mousedown',()=>{if(gameRunning) jump()});
</script>
</body>
</html>
