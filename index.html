<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TSUNAMI Z</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f0f0f;color:#fff;overflow:hidden;touch-action:manipulation}
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px;background:linear-gradient(180deg,#0a1a0a,#0f4a1f);overflow-y:auto}
#menu h1{font-size:2.7em;letter-spacing:3px;color:#39ff14;text-shadow:0 0 14px rgba(57,255,20,.7);margin-bottom:6px}
#menu p.sub{color:#b0ff9a;margin-bottom:18px;font-size:.95em}
#menu input{width:80%;max-width:280px;padding:13px 18px;font-size:1.05em;border:2px solid #39ff14;border-radius:12px;background:rgba(0,0,0,.35);color:#fff;outline:none;text-align:center;margin-bottom:14px}
button{padding:13px 42px;font-size:1.08em;border:none;border-radius:12px;background:#39ff14;color:#0a1a0a;cursor:pointer;font-weight:bold;box-shadow:0 4px 0 #1a7a0a}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #1a7a0a}
#gameCanvas{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh}
#hud{position:fixed;top:10px;left:0;width:100%;display:none;justify-content:space-between;padding:0 14px;font-weight:bold;z-index:5;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.7);font-size:.9em}
#hud span{background:rgba(0,0,0,.5);padding:7px 11px;border-radius:10px;backdrop-filter:blur(4px)}
#gameOver{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;background:rgba(0,0,0,.88);position:fixed;top:0;left:0;width:100vw;z-index:20;padding:20px;overflow-y:auto}
#gameOver h1{font-size:2em;color:#39ff14;margin-bottom:8px}
#gameOver .score{font-size:1.4em;color:#fff;margin-bottom:6px}
.ranking{width:100%;max-width:340px;margin:12px 0;background:rgba(255,255,255,.06);border:1px solid rgba(57,255,20,.25);border-radius:12px;padding:12px}
.ranking h3{font-size:.92em;color:#39ff14;text-align:center;margin-bottom:8px}
.ranking ol{list-style:none}
.ranking li{display:flex;justify-content:space-between;padding:6px 8px;border-radius:8px;font-size:.88em}
.ranking li.me{background:rgba(57,255,20,.15);font-weight:bold}
#instructions{font-size:.78em;color:#b0ff9a;margin-top:10px;line-height:1.4;max-width:320px}
</style>
</head>
<body>
<div id="menu">
  <h1>TSUNAMI Z</h1>
  <p class="sub">Proyecto U — Atrapa peatones y haz crecer la horda</p>
  <input id="nameInput" placeholder="Tu nombre" maxlength="15" autocomplete="off">
  <button id="playBtn">JUGAR</button>
  <div id="instructions">Toque corto = salto · Mantén para flotar<br>Atrapa peatones para +zombies · Monedas +10 · Bombas te quitan zombies</div>
  <div class="ranking" id="menuRanking"></div>
</div>
<canvas id="gameCanvas"></canvas>
<div id="hud"><span id="hudLeft"></span><span id="hudRight"></span></div>
<div id="gameOver">
  <h1>HORDA DEVORADA</h1>
  <p class="score" id="goScore"></p>
  <p id="goZombies" style="color:#39ff14"></p>
  <p id="goCoins" style="color:#ffd700"></p>
  <div class="ranking" id="goRanking"></div>
  <button id="restartBtn">Jugar de nuevo</button>
  <button id="menuBtn" style="margin-top:10px;background:transparent;border:2px solid #39ff14;color:#39ff14">Menú</button>
</div>
<script>
const canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d');
const menu=document.getElementById('menu'), hud=document.getElementById('hud'), hudLeft=document.getElementById('hudLeft'), hudRight=document.getElementById('hudRight');
const goScore=document.getElementById('goScore'), goZombies=document.getElementById('goZombies'), goCoins=document.getElementById('goCoins');
const nameInput=document.getElementById('nameInput'), playBtn=document.getElementById('playBtn'), restartBtn=document.getElementById('restartBtn'), menuBtn=document.getElementById('menuBtn');
const menuRanking=document.getElementById('menuRanking'), goRanking=document.getElementById('goRanking'), gameOverScreen=document.getElementById('gameOver');
let W,H,player,pedestrians=[],obstacles=[],coins=[],particles=[],score=0,coinsCollected=0,gameRunning=false,animId,speed=3.8,holding=false,tick=0,bgOffset=0;
const GRAVITY=0.52,HOVER_GRAVITY=0.20,JUMP=-12.6,DOUBLE_JUMP=-11.2,GROUND_RATIO=0.16,MAX_JUMPS=2;
// --- Pixel art sprites ---
const zombieImgs=[new Image(),new Image(),new Image()];
zombieImgs[0].src='assets/zombie_walk_A.png';
zombieImgs[1].src='assets/zombie_walk_B.png';
zombieImgs[2].src='assets/zombie_walk_C.png';
let spritesLoaded=false;
let loadedCount=0; zombieImgs.forEach(img=>{img.onload=()=>{loadedCount++; if(loadedCount===3) spritesLoaded=true;}; img.onerror=()=>{loadedCount++;};});
ctx.imageSmoothingEnabled=false;

let ac;
function getAc(){if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac;}
function sndJump(d){try{const a=getAc(),o=a.createOscillator(),g=a.createGain();o.frequency.value=d?520:360;o.connect(g);g.connect(a.destination);g.gain.value=0.16;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.18);o.frequency.exponentialRampToValueAtTime(d?820:620,a.currentTime+0.1);o.stop(a.currentTime+0.19)}catch(e){}}
function sndCoin(){try{const a=getAc();[659,880].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=0.13;const t=a.currentTime+i*0.08;o.start(t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);o.stop(t+0.18)})}catch(e){}}
function sndEat(){try{const a=getAc(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=300;o.connect(g);g.connect(a.destination);g.gain.value=0.18;o.start();o.frequency.linearRampToValueAtTime(900,a.currentTime+0.12);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.18);o.stop(a.currentTime+0.19)}catch(e){}}
function sndHit(){try{const a=getAc(),o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=140;o.connect(g);g.connect(a.destination);g.gain.value=0.18;o.start();o.frequency.linearRampToValueAtTime(60,a.currentTime+0.22);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.24);o.stop(a.currentTime+0.25)}catch(e){}}

const KEY='tsunami_z_ranking';
function loadRank(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function saveRank(name, sc){
  const list=loadRank(); list.push({name,score:Math.floor(sc),date:Date.now()});
  const m=new Map(); for(const e of list){const c=m.get(e.name); if(!c||e.score>c.score) m.set(e.name,e)}
  const best=[...m.values()].sort((a,b)=>b.score-a.score).slice(0,10);
  localStorage.setItem(KEY,JSON.stringify(best)); return best;
}
function renderRank(el,hl){
  const l=loadRank();
  if(l.length===0){el.innerHTML='<h3>Ranking</h3><p style="color:#777;font-size:.85em">Aun sin partidas</p>';return}
  let h='<h3>Ranking Top 10</h3><ol>'; l.forEach((e,i)=>{h+=`<li${e.name===hl?' class="me"':''}><span>${i+1}. ${e.name}</span><span>${e.score}m</span></li>`}); h+='</ol>'; el.innerHTML=h;
}
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize(); addEventListener('resize',resize); renderRank(menuRanking);

function init(n){
  resize(); tick=0; bgOffset=0;
  player={x:W*0.13,y:H*(1-GROUND_RATIO)-36,w:36,h:36,vy:0,grounded:true,jumps:0,name:n,horde:4,runPhase:0};
  pedestrians=[]; obstacles=[]; coins=[]; particles=[]; score=0; coinsCollected=0; speed=3.8; holding=false;
  gameOverScreen.style.display='none'; menu.style.display='none'; canvas.style.display='block'; hud.style.display='flex';
  getAc(); updateHud();
}
function updateHud(){ hudLeft.textContent=`${player.name} · ${Math.floor(score)}m`; hudRight.textContent=`Zombies: ${player.horde} · Monedas: ${coinsCollected}`; }

function drawBg(){
  const gy=H*(1-GROUND_RATIO);
  // cielo degradado
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#050d05'); g.addColorStop(0.55,'#0f2a0f'); g.addColorStop(1,'#1a331a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // luna con brillo
  ctx.save(); ctx.shadowColor='rgba(255,255,160,.6)'; ctx.shadowBlur=18;
  ctx.fillStyle='rgba(255,255,180,.95)'; ctx.beginPath(); ctx.arc(W*0.84, 72, 24,0,Math.PI*2); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(W*0.84+5,68,6,0,Math.PI*2); ctx.fill();
  // estrellas
  ctx.fillStyle='rgba(255,255,255,.5)'; for(let i=0;i<12;i++){ const x=(i*137 + bgOffset*0.1)%W; const y=20+(i*37)%90; ctx.fillRect(x,y,1.5,1.5); }
  // edificios lejanos con parallax
  ctx.fillStyle='#0b1e0b';
  for(let layer=0;layer<2;layer++){
    const off = (bgOffset*(0.3+layer*0.3))%90;
    ctx.beginPath(); ctx.moveTo(-off,gy);
    for(let x=-off;x<=W+90;x+=38+layer*12){
      const h = 28+Math.sin(x*0.05)*10 + (x%90<40?16:0) + layer*12;
      ctx.lineTo(x,gy-h); ctx.lineTo(x+18,gy-h); ctx.lineTo(x+18,gy);
    }
    ctx.lineTo(W,gy); ctx.fill();
    // ventanas
    ctx.fillStyle= layer===0?'rgba(57,255,20,.18)':'rgba(57,255,20,.08)';
    for(let x=10-off;x<W;x+=38){ for(let wy=gy-18; wy>gy-38; wy-=10){ if(Math.random()>0.6) ctx.fillRect(x+4,wy,4,5);} }
    ctx.fillStyle='#0b1e0b';
  }
  // suelo con textura
  ctx.fillStyle='#1c1c1c'; ctx.fillRect(0,gy,W,H-gy);
  // linea verde neón
  ctx.fillStyle='#39ff14'; ctx.shadowColor='#39ff14'; ctx.shadowBlur=8; ctx.fillRect(0,gy,W,3); ctx.shadowBlur=0;
  // detalles suelo
  ctx.fillStyle='rgba(255,255,255,.06)'; for(let x=(bgOffset*1.2)%40-40;x<W;x+=40) ctx.fillRect(x,gy+8,18,2);
}

// zombie pixel art con sprite real si carga, fallback a dibujo
function drawZombie(x,y,phase, isLeader, inAir, holding){
  const bob = inAir ? 0 : Math.sin(phase)*2.2;
  const ty = y + bob;
  // sombra
  if(!inAir){ ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x+7, y+16, 7,3,0,0,Math.PI*2); ctx.fill(); }
  const idx = Math.abs(Math.floor(x+y)) % 3;
  const img = zombieImgs[idx];
  if(spritesLoaded && img.complete && img.naturalWidth>0){
    ctx.save();
    if(inAir && holding){ ctx.translate(x+7, ty+8); ctx.rotate(-0.12); ctx.translate(-x-7, -ty-8); }
    ctx.imageSmoothingEnabled=false;
    // animación por frames: recorta 4 frames horizontales del spritesheet
    const frames=4;
    const fw = img.width/frames, fh = img.height;
    const f = Math.floor(phase*1.2) % frames;
    // dibuja frame pixelado escalado a 22x26
    try{ ctx.drawImage(img, f*fw, 0, fw, fh, x-4, ty-10, 22, 26);}catch(e){
      // fallback si recorte falla, dibuja entero
      ctx.drawImage(img, x-4, ty-10, 22, 26);
    }
    ctx.restore();
    // borde lider
    if(isLeader){ ctx.strokeStyle='rgba(57,255,20,.9)'; ctx.lineWidth=1; ctx.strokeRect(x-4,ty-10,22,26); }
    return;
  }
  // fallback dibujo vectorial (si no cargó sprite)
  const legSwing = inAir ? 0 : Math.sin(phase)*6;
  const armSwing = inAir ? 0 : Math.sin(phase+1)*5;
  ctx.save();
  if(inAir && holding){ ctx.translate(x+7, ty+8); ctx.rotate(-0.12); ctx.translate(-x-7, -ty-8); }
  ctx.fillStyle='#1a4a1a'; ctx.fillRect(x+2+legSwing*0.18, ty+12, 4, 6); ctx.fillRect(x+8-legSwing*0.18, ty+12, 4, 6);
  ctx.fillStyle = isLeader ? '#39ff14' : '#2ecc71'; ctx.fillRect(x, ty, 14, 12);
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(x, ty+5,14,2);
  ctx.fillStyle='#2a7a2a'; ctx.fillRect(x-3+armSwing*0.2, ty+2, 4,7); ctx.fillRect(x+13-armSwing*0.2, ty+2, 4,7);
  if(inAir && holding){ ctx.fillRect(x-5, ty, 3,4); ctx.fillRect(x+16, ty,3,4); }
  ctx.fillStyle='#c8f5b8'; ctx.fillRect(x+2, ty-8, 10,9); ctx.fillStyle='#1a1a1a'; ctx.fillRect(x+2, ty-8,10,3);
  if(inAir){ ctx.fillStyle='#000'; ctx.fillRect(x+3, ty-3, 2.5,1.5); ctx.fillRect(x+9, ty-3,2.5,1.5);
  } else { const eyeY = ty-4 + Math.sin(phase)*0.3; ctx.fillStyle='#000'; ctx.fillRect(x+3, eyeY, 2.5,2.5); ctx.fillRect(x+9, eyeY,2.5,2.5); ctx.fillStyle='#ff1a1a'; ctx.fillRect(x+3.7, eyeY+0.7,1,1); ctx.fillRect(x+9.7, eyeY+0.7,1,1); }
  ctx.fillStyle='#2a0000'; ctx.fillRect(x+5, ty-1,4,1.5); ctx.fillStyle='#fff'; ctx.fillRect(x+6, ty-1,1,1); ctx.fillRect(x+8, ty-1,1,1);
  ctx.restore();
}

function drawHorde(){
  const baseX=player.x, baseY=player.y;
  const inAir = !player.grounded;
  for(let i=0;i<player.horde;i++){
    const col=i%4, row=Math.floor(i/4);
    const x = baseX + col*11 - (player.horde>6?8:0) + Math.sin(tick*0.08+i)*0.6;
    const y = baseY - row*12;
    const phase = tick*0.55 + i*0.9;
    drawZombie(x,y,phase,i===0,inAir,holding);
  }
}

function drawPedestrians(){
  pedestrians.forEach(p=>{
    if(p.eaten) return;
    const phase = tick*0.45 + p.x*0.02;
    const bob = Math.sin(phase)*1.6;
    const leg = Math.sin(phase)*4;
    const x=p.x, y=p.y+bob;
    // sombra
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x+8,y+p.h,6,2,0,0,Math.PI*2); ctx.fill();
    // cuerpo (huye mirando a la izquierda)
    ctx.fillStyle='#5dade2'; ctx.fillRect(x,y, p.w, p.h);
    ctx.fillStyle='#2e86c1'; ctx.fillRect(x, y+6, p.w,3);
    // piernas corriendo
    ctx.fillStyle='#1a5276'; ctx.fillRect(x+2+leg*0.2, y+12,3,6); ctx.fillRect(x+9-leg*0.2, y+12,3,6);
    // cabeza
    ctx.fillStyle='#ffdbac'; ctx.beginPath(); ctx.arc(x+8, y-4,6,0,Math.PI*2); ctx.fill();
    // pelo
    ctx.fillStyle='#4a2c0a'; ctx.beginPath(); ctx.arc(x+8, y-7,6,0,Math.PI); ctx.fill();
    // ojos asustados
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+6,y-4,1.8,0,Math.PI*2); ctx.beginPath(); ctx.arc(x+10,y-4,1.8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(x+6,y-4,0.9,0,Math.PI*2); ctx.beginPath(); ctx.arc(x+10,y-4,0.9,0,Math.PI*2); ctx.fill();
    // signo !
    ctx.fillStyle='#ff1a1a'; ctx.font='bold 9px Arial'; ctx.textAlign='center'; ctx.fillText('!',x+8,y-12);
    // brazos corriendo
    ctx.fillStyle='#ffdbac'; ctx.fillRect(x-2 - leg*0.15, y+2,3,5); ctx.fillRect(x+p.w-1+leg*0.15, y+2,3,5);
  });
}

function drawObstacles(){
  obstacles.forEach(o=>{
    if(o.type==='bomb'){
      const bob=Math.sin(tick*0.25+o.x*0.01)*1.5;
      const y=o.y+bob;
      ctx.save();
      // mecha chispa
      ctx.strokeStyle='#ffd700'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(o.x+o.w/2, y); ctx.lineTo(o.x+o.w/2+4, y-6); ctx.stroke();
      ctx.fillStyle='#ff6b00'; ctx.beginPath(); ctx.arc(o.x+o.w/2+4, y-6, 2.5+Math.sin(tick*0.6)*1,0,Math.PI*2); ctx.fill();
      // bomba
      ctx.fillStyle='#0a0a0a'; ctx.strokeStyle='#333'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(o.x+o.w/2, y+o.h/2+4, o.w/2,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#444'; ctx.fillRect(o.x+o.w/2-4, y+2,8,4);
      // calavera
      ctx.fillStyle='#ff1a1a'; ctx.font='bold 10px Arial'; ctx.textAlign='center'; ctx.fillText('💣',o.x+o.w/2, y+o.h/2+7);
      ctx.restore();
    } else {
      ctx.fillStyle='#3a3a3a'; ctx.fillRect(o.x,o.y,o.w,o.h);
      // ladrillos
      ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1;
      for(let yy=o.y+4; yy<o.y+o.h; yy+=6){ ctx.beginPath(); ctx.moveTo(o.x,yy); ctx.lineTo(o.x+o.w,yy); ctx.stroke(); }
      ctx.fillStyle='#39ff14'; ctx.shadowColor='#39ff14'; ctx.shadowBlur=6; ctx.fillRect(o.x,o.y-3,o.w,3); ctx.shadowBlur=0;
      // grietas
      ctx.strokeStyle='#000'; ctx.beginPath(); ctx.moveTo(o.x+8,o.y+6); ctx.lineTo(o.x+12,o.y+14); ctx.stroke();
    }
  });
}

function drawCoins(){
  coins.forEach(c=>{
    if(c.collected) return;
    ctx.save();
    const bob=Math.sin(tick*0.12 + c.x*0.01)*3;
    const spin = Math.abs(Math.cos(tick*0.14 + c.x*0.02)); // efecto 3D
    const cx=c.x+c.w/2, cy=c.y+c.h/2+bob;
    ctx.translate(cx,cy); ctx.scale(spin,1);
    // brillo
    ctx.fillStyle='#ffd700'; ctx.strokeStyle='#ff8c00'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,c.w/2,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(-3,-4,4,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff8c00'; ctx.font='bold 12px Arial'; ctx.textAlign='center'; ctx.fillText('$',0,4);
    ctx.restore();
  });
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha = p.life;
    ctx.fillStyle=p.color;
    ctx.font='bold 13px Arial'; ctx.fillText(p.text, p.x, p.y);
  });
  ctx.globalAlpha=1;
}

function update(){
  if(!gameRunning) return;
  tick++; bgOffset+=speed*0.6;
  speed=3.8 + Math.floor(score/220)*0.2;
  if(player.grounded) score+=speed*0.18;
  updateHud();
  if(!player.grounded){
    const g=holding?HOVER_GRAVITY:GRAVITY; if(holding&&player.vy>2) player.vy=2; player.vy+=g; player.y+=player.vy;
    const gy=H*(1-GROUND_RATIO)-player.h; if(player.y>=gy){player.y=gy;player.vy=0;player.grounded=true;player.jumps=0; // polvo
      for(let i=0;i<4;i++) particles.push({x:player.x+10+Math.random()*20,y:gy,vy:-1-Math.random()*2,vx:(Math.random()-0.5)*3,life:1,text:'·',color:'rgba(57,255,20,.7)'});
    } if(player.y<0){player.y=0;player.vy=0}
  }
  if(Math.random()<0.018){
    const gy=H*(1-GROUND_RATIO); const h=20+Math.random()*8, w=16; const y=gy-h;
    const cnt=1+(Math.random()<0.28?1:0);
    for(let i=0;i<cnt;i++) pedestrians.push({x:W+10+i*20,y:y,w:w,h:h,eaten:false});
  }
  if(Math.random()<0.010){
    const gy=H*(1-GROUND_RATIO); const isBomb=Math.random()<0.45; const w=isBomb?22:28, h=isBomb?22:18+Math.random()*12;
    obstacles.push({x:W+10,y:gy-h,w:w,h:h,type:isBomb?'bomb':'wall'});
  }
  if(Math.random()<0.035){
    const gy=H*(1-GROUND_RATIO); const y=gy-55-Math.random()*45; coins.push({x:W+10,y:y,w:24,h:24,collected:false});
  }
  const spd=speed;
  pedestrians.forEach(p=> p.x-=spd);
  obstacles.forEach(o=> o.x-=spd);
  coins.forEach(c=> c.x-=spd);
  // particulas
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life-=0.03; });
  particles=particles.filter(p=>p.life>0);

  pedestrians.forEach(p=>{
    if(!p.eaten && player.x < p.x+p.w && player.x+player.w+ (player.horde*1.4) > p.x && player.y < p.y+p.h+10 && player.y+player.h > p.y){
      p.eaten=true; player.horde += 1; score+=15; sndEat();
      particles.push({x:p.x,y:p.y,vy:-2.2,vx:0,life:1,text:'+1',color:'#39ff14'});
      // transformar: particula verde
      for(let i=0;i<3;i++) particles.push({x:p.x+8,y:p.y+6,vy:-1-Math.random(),vx:(Math.random()-0.5)*2,life:1,text:'•',color:'#39ff14'});
    }
  });
  coins.forEach(c=>{
    if(!c.collected && player.x-6 < c.x+c.w && player.x+player.w+6 > c.x && player.y-6 < c.y+c.h && player.y+player.h+6 > c.y){
      c.collected=true; coinsCollected++; score+=10; sndCoin();
      particles.push({x:c.x,y:c.y,vy:-1.8,vx:0,life:1,text:'+10',color:'#ffd700'});
    }
  });
  const pr=6;
  for(const o of obstacles){
    if(player.x+player.w-pr>o.x && player.x+pr<o.x+o.w && player.y+player.h-pr>o.y && player.y+pr<o.y+o.h){
      o.x=-100;
      if(o.type==='bomb'){ player.horde=Math.max(0,player.horde-3); particles.push({x:o.x+12,y:o.y,vy:-2,vx:0,life:1,text:'-3',color:'#ff1a1a'}); sndHit(); }
      else { player.horde=Math.max(0,player.horde-1); particles.push({x:o.x+12,y:o.y,vy:-2,vx:0,life:1,text:'-1',color:'#ff6b6b'}); sndHit(); }
      // shake
      canvas.style.transform='translate(2px,0)'; setTimeout(()=>canvas.style.transform='',60);
      if(player.horde<=0){ gameRunning=false; cancelAnimationFrame(animId); const best=saveRank(player.name,score); goScore.textContent=Math.floor(score)+' m'; goZombies.textContent='Horda final: '+player.horde; goCoins.textContent='Monedas: '+coinsCollected; renderRank(goRanking,player.name); renderRank(menuRanking,player.name); gameOverScreen.style.display='flex'; return; }
    }
  }
  pedestrians=pedestrians.filter(p=>!p.eaten && p.x+p.w>-30);
  obstacles=obstacles.filter(o=>o.x+o.w>-40);
  coins=coins.filter(c=>!c.collected && c.x+c.w>-30);
  drawBg(); drawCoins(); drawPedestrians(); drawObstacles(); drawHorde(); drawParticles();
}
function jump(){
  if(!gameRunning||!player) return;
  if(player.jumps>=MAX_JUMPS) return;
  const d=player.jumps===1; player.vy=d?DOUBLE_JUMP:JUMP; player.grounded=false; player.jumps++; sndJump(d);
}
function startLoop(){ function loop(){update(); if(gameRunning) animId=requestAnimationFrame(loop)} loop()}
function showMenu(){ gameRunning=false; cancelAnimationFrame(animId); gameOverScreen.style.display='none'; canvas.style.display='none'; hud.style.display='none'; menu.style.display='flex'; renderRank(menuRanking, nameInput.value.trim()||null); }

playBtn.addEventListener('click',()=>{const n=nameInput.value.trim()||'Jugador'; init(n); gameRunning=true; startLoop()});
restartBtn.addEventListener('click',()=>{ init(player?player.name:'Jugador'); gameRunning=true; startLoop()});
menuBtn.addEventListener('click',showMenu);
function setHold(v){holding=v; if(gameRunning) updateHud();}
document.addEventListener('keydown',e=>{ if((e.code==='Space'||e.code==='ArrowUp')&&gameRunning){ if(e.repeat){setHold(true);return} jump(); setHold(true); e.preventDefault(); }});
document.addEventListener('keyup',e=>{ if(e.code==='Space'||e.code==='ArrowUp') setHold(false);});
let touchAct=false;
canvas.addEventListener('pointerdown',e=>{e.preventDefault(); if(!gameRunning) return; touchAct=true; jump(); setHold(true); canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',e=>{e.preventDefault(); touchAct=false; setHold(false);});
canvas.addEventListener('pointercancel',()=>{touchAct=false; setHold(false);});
canvas.addEventListener('pointerleave',()=>{if(touchAct) setHold(false);});
</script>
</body>
</html>
